<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>КРЭТ™</title>
<style>
body {background-color: Azure;}
#header {
    background-color:tan;
    clear:both;
    text-align:center;
    padding:5px;    
}
table {
	border: 2px solid green;
	border-collapse: collapse;
    background-color:#eeeeee;
	margin:10px;
    height:100%;
    float:left;
}
tr:hover {background-color:White;}
th, td {
	font-size: 0.9rem;
	text-align: center;
	border: 1px solid green;
}
.tooltip {
	position: relative;
	display: inline-block;
}
.tooltip .tooltiptext {
	visibility: hidden;
	width: 300px;
	background-color: green;
	color: #fff;
	text-align: left;
	padding: 12px;
	position: absolute;
}
.tooltip:hover .tooltiptext {
	visibility: visible;
	opacity: 1;
}
.soft-parent {
	position: relative;
	z-index: 0;
}
.soft-child {
	position: absolute;
	bottom: 25%;
	right: 2%;
	font-family: Verdana, sans-serif;
	font-size: smaller;
} 
</style>
</head>
<body>
	<div id="header">
		<button style="background-color:green; color:white">Отладка и обновление</button>
	</div>

	<script type="text/javascript" >
		    let naviButton = document.querySelectorAll('#header > button')[0];
			naviButton.addEventListener('click', () => window.location.replace('/update'));
	</script>
</body>
<footer>
	<div id="header" class="soft-parent">АО "ГРПЗ" филиал "Касимовский приборный завод" © 2025<div class="soft-child">Версия ПО: 1.1</div></div>
</footer>
</html>
