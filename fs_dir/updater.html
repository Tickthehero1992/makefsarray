<style>
body {background-color: Azure;}
#header {

table {
	border: 2px solid green;
	border-collapse: collapse;
    background-color:#eeeeee;
	margin:10px;
    height:100%;
    float:left;
}
tr:hover {background-color:White;}
th, td {
	font-size: 0.9rem;

	border: 1px solid green;
}
.tooltip {
	position: relative;
	display: inline-block;
}
.tooltip .tooltiptext {
	visibility: hidden;
	width: 300px;
	background-color: green;
	color: #fff;
	text-align: left;
	padding: 12px;
	position: absolute;
}
.tooltip:hover .tooltiptext {
	visibility: visible;
	opacity: 1;
}
.soft-parent {
	position: relative;
	z-index: 0;
}
.soft-child {
	position: absolute;
	bottom: 25%;
	right: 2%;
	font-family: Verdana, sans-serif;
	font-size: smaller;
}
</style>
</head>
